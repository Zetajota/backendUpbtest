name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis de JavaScript
        shell: bash
        run: find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Desplegar en Render
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Omitir despliegue sin secreto
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        shell: bash
        run: echo "::warning::No se ejecutó el despliegue porque falta el secreto RENDER_DEPLOY_HOOK_URL."
